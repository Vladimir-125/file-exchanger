services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATA_DIR: /data # beats env_file: .env.example sets a local path
    env_file:
      - path: .env
        required: false
    ports:
      # loopback only: Docker's published ports bypass host firewalls such as ufw
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - data:/data

volumes:
  data:
